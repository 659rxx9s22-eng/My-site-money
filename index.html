<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأرباح</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>لوحة إحصائيات زينب</h1>
            <p>سجلي دخولكِ لمتابعة الأرباح</p>
        </header>

        <div class="auth-buttons">
            <button onclick="login()" class="btn-login">تسجيل دخول</button>
            <button onclick="register()" class="btn-register">إنشاء حساب جديد</button>
        </div>

        <div class="stats-grid">
            <div class="card">
                <h3>إجمالي النقرات</h3>
                <p id="total-clicks">0</p>
            </div>
            <div class="card">
                <h3>الأرباح الحالية</h3>
                <p id="earnings">$0.00</p>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
